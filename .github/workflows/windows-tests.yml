name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (Windows / Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q pvz_reader pvz_controller tools

      - name: Run offline test suite
        shell: pwsh
        run: python -m unittest discover -s tools -p "test_*.py" -v
